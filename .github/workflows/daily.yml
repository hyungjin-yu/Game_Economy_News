name: Daily Game News

on:
  schedule:
    # 00:50 UTC runs at 09:50 KST
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ECONOMY_WEBHOOK_URL: ${{ secrets.DISCORD_ECONOMY_WEBHOOK_URL }}
          DISCORD_WORLD_IT_WEBHOOK_URL: ${{ secrets.DISCORD_WORLD_IT_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py --run-now

      - name: Save seen URLs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/seen_urls.json
          git diff --cached --quiet || (git commit -m "chore: update seen URLs" && git push)
